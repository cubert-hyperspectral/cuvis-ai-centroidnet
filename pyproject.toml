[project]
name = "cuvis-ai-centroidnet"
dynamic = ["version"]
description = "CentroidNetV2 nodes for cuvis-ai: counting and separating small, touching objects by centre and border voting."
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Cubert GmbH", email = "cuvis.ai@cubert-gmbh.de" },
]
maintainers = [
  { name = "Cubert GmbH", email = "cuvis.ai@cubert-gmbh.de" },
]
license = { text = "Apache-2.0" }
readme = "README.md"

keywords = [
  "cuvis",
  "hyperspectral",
  "centroidnet",
  "counting",
  "instance-segmentation",
  "plugin",
  "cuvis-ai",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: OS Independent",
]

dependencies = [
  "cuvis-ai-core>=0.20.2",
  "cuvis-ai-schemas>=0.14.4",
  "torch>=2.1",
  # torchvision is declared directly so the cuda-group cu128 source pin below keeps the
  # torch/torchvision pair same-build in this checkout (cuvis-ai-core depends on both).
  "torchvision",
  # Connected components of the class mask (ConnectedComponentInstances). cuvis-ai-core
  # ships the same package; it is named here because this package imports it.
  "opencv-python-headless>=4.8",
  "numpy>=1.26",
  # Imported directly by CentroidDetectionMetrics. The floor stays at or below the version
  # cuvis-ai-core locks, which the compatibility workflow checks.
  "torchmetrics>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "ruff",
  "mypy",
  "bandit",
  "detect-secrets",
  "pip-audit",
  "twine>=6.2.0",
  # ONNX parity of the exportable nodes (torch.onnx.export dynamo + ONNX Runtime).
  "cuvis-ai-core[onnx]>=0.20.2",
  # The chain tests wire these nodes to the vote and local-maxima nodes of cuvis-ai. Until a
  # cuvis-ai release ships those two, CI installs the commit that has them over this one
  # (see the `chain` job in .github/workflows/ci.yml).
  "cuvis-ai[onnx]>=0.22.8",
]
# Runtime packages of examples/fod_lentils: `uv sync --extra examples`. cuvis-ai-unet and
# cuvis-ai-augment ship as git tags, not on PyPI, so they cannot live in this extra; the README
# gives the two install lines. `cuvis-ai-dataloader[cu3s]` needs a Cuvis SDK of the matching
# version on the machine.
examples = [
  "cuvis-ai-dataloader[cu3s,coco]>=0.9.1",
  "cuvis-ai>=0.22.8",
  "huggingface_hub",
  "click>=8.1",
]

[project.urls]
Homepage   = "https://docs.cuvis.ai/latest/"
Repository = "https://github.com/cubert-hyperspectral/cuvis-ai-centroidnet"
Issues     = "https://github.com/cubert-hyperspectral/cuvis-ai-centroidnet/issues"
Changelog  = "https://github.com/cubert-hyperspectral/cuvis-ai-centroidnet/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cuvis_ai_centroidnet*"]

[tool.setuptools.package-data]
cuvis_ai_centroidnet = ["configs/**/*.yaml"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.1.0"

[tool.uv]
default-groups = ["cuda"]

[dependency-groups]
# Floors live in [project].dependencies; this group only carries the cu128 index pin.
# torchvision rides along so the torch/torchvision pair stays same-build in this checkout.
cuda = ["torch", "torchvision"]

# The cu128 pin is scoped to the `cuda` dependency group (installed by default here) because
# uv also reads a git dependency's `[tool.uv.sources]`: an unscoped pin would reach every
# composed child environment that pulls this repo from git and collide with the torch index
# of that host. Consumers never install a dependency's groups. On an aarch64 checkout, sync
# without the pin: `uv sync --no-default-groups`.
[tool.uv.sources]
torch = { index = "pytorch-cu128", group = "cuda" }
torchvision = { index = "pytorch-cu128", group = "cuda" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: small, fast tests on tensors, no network and no data files.",
  "integration: the shipped manifest loads through NodeRegistry.",
  "chain: these nodes wired to DynUNet (cuvis-ai-unet) and the vote nodes of cuvis-ai; needs both installed.",
  "slow: GPU or real-data tests, skipped in CI (run with -m slow).",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
extend-select = ["ANN201", "ANN202", "ANN204"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN202", "ANN204", "E501"]
"examples/**" = ["ANN201", "ANN202", "ANN204", "E501", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests", "examples", "build", "dist"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]

[tool.coverage.run]
source = ["cuvis_ai_centroidnet"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
